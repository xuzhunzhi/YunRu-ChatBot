distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Official Gradle CDN. services.gradle.org only 307-redirects to github.com/gradle/gradle-distributions,
# which is unreachable from this machine (connect timeout); downloads.gradle.org serves the same
# 9.7.1 artifact directly with HTTP 200. Both hosts are Gradle's own, so this is not a third-party mirror.
distributionUrl=https\://downloads.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=120000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
