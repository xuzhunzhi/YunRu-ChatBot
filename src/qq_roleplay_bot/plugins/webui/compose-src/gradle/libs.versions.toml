# Versions below are copied from the Miuix 0.9.4 checkout
# (run/data/tmp_miuix/miuix-0.9.4/gradle/libs.versions.toml), so this probe is built
# with the exact Kotlin / Compose Multiplatform the published Miuix wasm klibs use.
#   kotlin                      -> libs.versions.toml:3   kotlin = "2.4.20"
#   jetbrains-compose-multiplatform -> libs.versions.toml:10  jetbrains-compose-multiplatform = "1.12.0"
# (Skiko has no entry there: it is resolved transitively from CMP 1.12.0.)

[versions]
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
miuix = "0.9.4"

[libraries]
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-wasm-js", version.ref = "miuix" }
miuix-core = { module = "top.yukonga.miuix.kmp:miuix-core-wasm-js", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-wasm-js", version.ref = "miuix" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
