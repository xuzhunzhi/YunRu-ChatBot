<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云茹 · 控制面板</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- 登录页（2026-10-04 用户："我强烈建议打开webui首先打开登录页而非在左下角输入令牌"）。
     没有有效令牌时只有这一屏；令牌存在浏览器本地，验过才进面板。
     它**不是**装饰：面板权限很大（能重启 bot、清会话、改提示词），
     所以"先确认你是谁"该是一道门，而不是塞在侧栏角落的一个输入框。 -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <h1 class="login-brand">云茹</h1>
    <p class="login-sub">控制面板</p>
    <label class="login-field">
      <span class="login-label">面板令牌</span>
      <input id="login-token" type="password" autocomplete="current-password"
             placeholder="粘贴面板令牌" autofocus>
    </label>
    <button id="login-submit" class="login-btn" type="submit">进入</button>
    <p id="login-hint" class="login-hint">
      令牌是<strong>正在跑的那个实例</strong>的 <code>data/webui_token</code>（只有本机能读）。
      生产实例在 <code>run/</code>、开发实例在各自那棵树里——<strong>两份不一样</strong>，
      拿错文件填进去会被判成"令牌不对"。
    </p>
    <p id="login-error" class="login-error" hidden></p>
  </form>
</div>

<!-- 宽屏布局照小米平板的设置页：**左边侧栏、右边详情**（用户 2026-10-01：
     "实际上这种宽屏就应该做左侧侧边栏+右侧详情，你去参考小米平板的设置页"）。

     2026-10-19 第三轮（用户判词："你这个就不是 miuix 的标准组件"）：这一个 `aside`
     现在**就是** Miuix 的 `NavigationRail`（`navigationrail.md`）——
     宽屏展开 240、窄屏收起 80，几何逐条对着 `NavigationRailDefaults`（见 app.css）。
     上一版那套"卡片套卡片 + 蓝色实心方块图标 + 右箭头 + 470px"整个删掉了。
     `aside` 里**只有导航**（静态部分连一颗按钮都没有：那颗收起/展开的按钮由
     `drawRailToggle()` 画进 `#rail-toggle-slot`，它是 `#tabs` 之外唯一的块）。 -->
<aside class="rail">
  <div class="rail-scroll">
    <div id="rail-toggle-slot" class="rail-toggle-slot"></div>
    <div class="rail-brand">
      <h1>云茹</h1>
      <p class="rail-sub">控制面板</p>
    </div>
    <nav id="tabs" aria-label="页面导航"></nav>
  </div>
</aside>

<main class="content">
  <!-- 这就是 Miuix 的 `TopAppBar`（`topappbar.md`）：`title` = 大标题、
       `subtitle` = 那一行说明。`navigationIcon` 槽**空着**——面板没有"上一层"可回
       （左栏任何宽度下都在，点它就能换页），所以槽里什么都不放，不摆一个假的返回键。
       `actionIconPadding` 那一侧的常驻「刷新」上一轮已被用户点名删掉。 -->
  <header class="page-head">
    <div class="page-head-main">
      <h2 id="page-title">总览</h2>
      <p id="page-nav" class="page-nav"></p>
    </div>
  </header>
  <p id="error" class="error" hidden></p>
  <section id="view">加载中…</section>
  <footer>
    <span>数据来源与口径：运行中取活快照，不在运行取文件；用量与 <code>/super apicheck</code> 同一账本。</span>
    <!-- 只读读数：回答"手机上 DPR 到底多少、落在响应式哪一档"。
         断点阈值按它调，不靠赌机型（见 app.css 的三档注释）。 -->
    <span id="viewport" class="dim"></span>
  </footer>
</main>

<!-- `Scaffold` 的 `popupHost`（`MiuixPopupHost`）：下拉/弹层都渲染在这一个宿主里
     （`overlaydropdownmenu.md` 的前提就是"必须在 Scaffold 里"）。
     面板只有一个宿主，层级由它自己管，不去每个调用点挂弹层。 -->
<div id="popup-host" class="miu-popup-host"></div>

<script src="/app.js"></script>
</body>
</html>
