<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云茹 · 控制面板</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- 登录页（2026-10-04 用户："我强烈建议打开webui首先打开登录页而非在左下角输入令牌"）。
     没有有效令牌时只有这一屏；令牌存在浏览器本地，验过才进面板。
     它**不是**装饰：面板权限很大（能重启 bot、清会话、改提示词），
     所以"先确认你是谁"该是一道门，而不是塞在侧栏角落的一个输入框。 -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <h1 class="login-brand">云茹</h1>
    <p class="login-sub">控制面板</p>
    <label class="login-field">
      <span class="login-label">面板令牌</span>
      <input id="login-token" type="password" autocomplete="current-password"
             placeholder="粘贴面板令牌" autofocus>
    </label>
    <button id="login-submit" class="login-btn" type="submit">进入</button>
    <p id="login-hint" class="login-hint">
      令牌在 bot 那边的 <code>data/webui_token</code> 里（只有本机能读）。
    </p>
    <p id="login-error" class="login-error" hidden></p>
  </form>
</div>

<!-- 宽屏布局照小米平板的设置页：**左边侧栏、右边详情**（用户 2026-10-01：
     "实际上这种宽屏就应该做左侧侧边栏+右侧详情，你去参考小米平板的设置页"）。
     侧栏那一套尺寸取自 Miuix 的 NavigationRail（ExpandedWidth 240dp、
     选中药丸圆角 16dp、条目左右外边距 12dp、内边距 14dp）。 -->
<aside class="rail">
  <div class="rail-brand">
    <h1>云茹</h1>
    <p class="rail-sub">控制面板</p>
  </div>
  <nav id="tabs" aria-label="页面导航"></nav>
  <div class="rail-foot">
    <span id="health" class="badge">连接中…</span>
    <span id="source" class="badge dim"></span>
    <div class="rail-actions">
      <button id="refresh" type="button">刷新</button>
      <button id="theme" class="icon-btn" type="button" title="切换浅色 / 深色">深色</button>
      <button id="signout" class="icon-btn" type="button" title="退出登录">退出</button>
    </div>
  </div>
</aside>

<main class="content">
  <header class="page-head">
    <!-- 窄屏（手机）下左栏与内容分开显示，这个按钮负责退回卡片列表。
         桌面与中等屏由 CSS 隐藏（那里两栏同时在，不需要"返回"）。 -->
    <button id="back" class="icon-btn" type="button" title="返回卡片列表">← 返回</button>
    <h2 id="page-title">总览</h2>
    <p id="page-nav" class="page-nav"></p>
  </header>
  <p id="error" class="error" hidden></p>
  <section id="view">加载中…</section>
  <footer>
    <span>数据来源与口径：运行中取活快照，不在运行取文件；用量与 <code>/super apicheck</code> 同一账本。</span>
    <!-- 只读读数：回答"手机上 DPR 到底多少、落在响应式哪一档"。
         断点阈值按它调，不靠赌机型（见 app.css 的三档注释）。 -->
    <span id="viewport" class="dim"></span>
  </footer>
</main>

<script src="/app.js"></script>
</body>
</html>
